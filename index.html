<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocaloid Clicker</title>

    <link href="./css/style.css" , rel="stylesheet">

    <script src="./scripts/main.js" ></script>
</head>

<body onload="game.startup()">
    <div class="topbar">
        <a href="https://discord.gg/rPAMv59wPM">Vocalhaven</a> 
        <a href="https://discord.gg/sPQFM9Rj33">Yuna Codes</a>
        <button onclick="game.storage.save()">Save game</button>
        <button onclick="game.storage.reset()">Reset game</button>
    </div>
    <div>
        <div class="section left">
            <div class="sectionLeft info">
                <div class="title" ; style="height: 70%;" id="points_current">
                    Loading...
                </div>
                <div class="small title" style="height: 30%;" id="points_per_second">
                    Loading...
                </div>
            </div>
            <div class="main buttonAnchor">
                <button class="main button" ;
                    onclick="var a = game.helper.math.clickAmount(); game.data.songs += a; game.data.totalSongs += a;">
                </button>
            </div>
        </div>
        <div class="section middle">
            <div id="notes" ; class="notes"></div>
        </div>
        <div class="section right">
            <div  class="shopTitle">
                <h1>Store</h1>
            </div>
            <br>
            <div class="bulkButtons">
                <button onclick="game.onClicked('changeBulk', 1)" ; class="bulkButtonSelected" ; id="bulkButton1">x1</button>
                <button onclick="game.onClicked('changeBulk', 10)" ; class="bulkButton" ; id="bulkButton10">x10</button>
                <button onclick="game.onClicked('changeBulk', 100)" ; class="bulkButton" ; id="bulkButton100">x100</button>
            </div>
            <div id="upgrades" ; class="upgrade list"></div>
        </div>
        <div class="tooltip">
            
        </div>
    </div>
</body>

</html>
