        <!-- >> YUNA LIBRARY << -->
        <script>
            // Yunas Format Library
            var format = {
                /**
                 * Abbreviates a number example 1234 -> 1.23K
                 * 
                 * @param {input} number - The number to format
                 * @returns {string} Formatted number (e.g., "1,23K")
                 */
                abbreviate: (input) => {
                    if (input < 1000) return input.toString();

                    const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
                    const suffixNum = Math.floor((String(Math.floor(input)).length - 1) / 3);

                    const scaled = input / Math.pow(1000, suffixNum);

                    let formatted = scaled.toPrecision(3);

                    // Remove trailing zeros / unnecessary decimal
                    formatted = parseFloat(formatted).toString();

                    return formatted + suffixes[suffixNum];
                }
            };
        </script>

        <!-- >> CODE TO SYNC DATA << -->
        <script>
            var sync = {
                income: () => {
                    Dev.Debug("Syncing income...", "sync");
                    var income = 0;

                    for (i in userData.upgrades) {
                        var data = userData.upgrades[i];
                        var reward = (data.amount * data.income);
                        income += reward;
                    };

                    userData.income = income;
                    Dev.Debug("Syncing income complete." + income, "sync");
                }
            };
        </script>

        <!-- >> HELPER << -->
        <script>
            var helper = {
                /**
                 * Returns the price of given data via upgrade formula
                 * 
                 * @param {basePrice} number - Base price of item
                 * @param {owns} number - How much the user owns
                 * @param {amount} number - How many are being attempted to purchase
                 * @return {number} - Calculated price 
                 */
                calculateUpgradeCost: (basePrice, owns, amount) => {
                    var price = 0;
                    do {
                        price += (basePrice * owns) + basePrice;
                        amount--;
                        owns++;
                    } while (amount > 0);
                    return Math.round(price)
                }
            };
        </script>

        <!-- >> MAIN << -->
        <script>

            var userData = {

                income: 0,

                upgrades: {

                    },
                    KagamineRin: {

                        unlocked: false,

                    KagamineLen: {

                        income: 1_250,

                        name: "Kagamine Len",
                        desc: "Just like Kagamine Rin"
                    },
                    AdachiRei: {
                        amount: 0,
                        cost: 7.5e6,
                        income: 3_000,

                        unlocked: false,

                        name: "Adachi Rei",
                        desc: "This heat is pretty abnormal"
                    },
                    EleanorForte: {
                        amount: 0,
                        cost: 25e6,

                        unlocked: false,

                        name: "Eleanor Forte",
                        desc: "They said it looked like rain"
                    },
                    YiXi: {
                        amount: 0,
                        cost: 100e6,
                        income: 25_000,

                        name: "Xi Yi",

                    },
                    MagurineLuka: {

                    },

                        unlocked: false,

                        name: "Hakaine Maiko",
                        desc: "Perfection!"
                    }
                },
                achievements: [
                    { req: "userData.totalPoints>0", gotten: false, text: "First note", desc: "Earn your first music note" },
                    { req: "userData.totalPoints>99", gotten: false, text: "Note factory", desc: "Earn your first 100 music notes" },
                    { req: "userData.totalPoints>999", gotten: false, text: "Note production", desc: "Earn your first 1.000 music notes" }
                ]
            };

            upgradeCache = {};
            functions = {
                update_upgrades: () => {
                    var needsReset = false;
                    for (i in userData.upgrades) {
                        var data = userData.upgrades[i];

                        if (upgradeCache[data.name] != data.amount) { 
                            needsReset = true;
                            upgradeCache[data.name] = data.amount;
                        };
                    };

                    if (!needsReset) return;
                    document.querySelector("#upgrades").innerHTML = "";

                    for (i in userData.upgrades) {
                        var data = userData.upgrades[i];
                        var text = "Could not fetch";
                        var price = helper.calculateUpgradeCost(data.cost, data.amount, tempData.purchaseAmount);
                        var cost = format.abbreviate(price);
                        var income = format.abbreviate(data.income)

                        if (userData.totalPoints < data.cost) {
                            document.querySelector("#upgrades").innerHTML += `<br><div>
                                <button class="upgrade locked">??? • Cost: ${cost}<br>???/s • ???</button>
                            </div>`;
                        } else {
                            document.querySelector("#upgrades").innerHTML += `<br><div>
                            <button class="upgrade unlocked"; onclick="onClicked('buy_upgrade', '${i}')">${data.name} • Cost: ${cost}<br>${income}/s • ${data.desc}</button>
                            </div>`;
                        };
                    };
                },

                buy_upgrade: (name) => {
                    var data = userData.upgrades[name];

                    if (!data) {
                        console.warn("No data found for upgrade: " + name);
                        return;
                    };

                    var price = helper.calculateUpgradeCost(data.cost, data.amount, tempData.purchaseAmount);
                    if (userData.points < price) return;

                    userData.points -= price;
                    data.amount++;
                    sync.income();
                }
            };

            function onClicked(Todo, Data) {
                Dev.Debug("onClick fired: " + Todo + "\n" + Data, "onClicked")
                if (!Dev.loaded) {
                    Dev.Debug("onClick rejected, waiting to load data...", "onClicked")
                    return
                };

                if (functions[Todo]) {
                    try {
                        functions[Todo](Data);
                    } catch (error) {
                        console.error("Function errored with name: " + Todo + "\nError: " + error);
                    };
                } else {
                    console.error("Called invalid function: " + Todo + "\nData: " + Data);
                };
            }; Dev.Debug("onClicked function ready", "loading");

            function UpdatePointsCount() {
                var notes = format.abbreviate(Math.round(userData.points));

                if (tempData.lastNoteTitle != notes) {
                    tempData.lastNoteTitle = notes
                    document.querySelector("#points_current").innerHTML = notes + " Music notes";
                };

                var perSecond = format.abbreviate(Math.round(userData.income));

                if (tempData.lastNotePerSecond != perSecond) {
                    tempData.lastNotePerSecond = perSecond
                    document.querySelector("#points_per_second").innerHTML = "~ " + perSecond + " per second ~";
                };
                document.title = format.abbreviate(Math.round(userData.points)) + " notes - Volcaloid Clicker"
            };

            function loadCookies() {
                var got = Cookies.get("user_data")
                if (got != null && got != "undefined") {
                    var userData_1 = JSON.parse(got);

                    for (i in userData.upgrades) {
                        if (userData_1.upgrades[i] == null) {
                            userData_1.upgrades[i] = userData.upgrades[i];
                        };
                    };

                    for (i in userData.achievements) {
                        if (userData_1.achievements[i] == null || userData.achievements[i].text != userData_1.achievements[i].text) {
                            userData_1.achievements[i] = userData.achievements[i];
                        };
                    };

                    if (Dev.unsave) {
                        Dev.Debug("⚠️⚠️⚠️ Unsave enabled, data not loaded ⚠️⚠️⚠️", "loading");
                        Dev.loaded = true;
                        return;
                    };

                    userData = userData_1;
                };

                Dev.loaded = true;
                Dev.Debug("Loaded cookies successfully", "loading");
                Dev.Debug("Cookies: " + got, "cookies");
            };

            function AutoUpdater() {
                Dev.Debug("Starting AutoUpdater", "loading");
                setInterval(() => {
                    if (!Dev.loaded) return;

                    userData.points += userData.income / 5;

                    // sync gui
                    onClicked("update_upgrades");

                    // achievements
                    for (i in userData.achievements) {
                        var achievement = userData.achievements[i];
                        var b = new Function("return " + achievement.req);
                        if (b() && !achievement.gotten) {
                            userData.achievements[i].gotten = true;
                            document.querySelector("#achievements").innerHTML += `<br>ACHIEVEMENT UNLOCKED<br>${achievement.text}<br>${achievement.desc}<br>`;
                            Dev.Debug("Unlocked achievement: " + achievement.text);
                        };
                    };

                    UpdatePointsCount();

                    Dev.delay++;
                    if (Dev.delay > Dev.saveInteraval) {
                        Cookies.set("user_data", JSON.stringify(userData), { expires: 364 });
                        Dev.delay = 0;

                        // Sync Income
                        sync.income();

                        Dev.Debug("Saved data to cookies", "saving");
                    };
                }, 200);
            };
        </script>
