        function utf8_to_b64(str) {
            try{return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode(parseInt(p1, 16))
            }));}
            catch(err)
            {return '';}
        };

        function b64_to_utf8(str) {
            try{return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            }).join(''));}
            catch(err)
            {return '';}
        };


        function escapeRegExp(str){return str.replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g, "\\$&");}

            /**
             * Abbreviates a number example 1234 -> 1.23K
             * 
             * @param {input} number - The number to format
             * @returns {string} Formatted number (e.g., "1,23K")
             */
            abbreviate: (input) => {
                if (input < 1000) return input.toString();

                const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
                const suffixNum = Math.floor((String(Math.floor(input)).length - 1) / 3);

                const scaled = input / Math.pow(1000, suffixNum);

                let formatted = scaled.toPrecision(3);

                formatted = parseFloat(formatted).toString();

                return formatted + suffixes[suffixNum];
            }
        };
        game.helper.math = {
            /**
             * Returns the price of given data via upgrade formula
             * 
             * @param {basePrice} number - Base price of item
             * @param {owns} number - How much the user owns
             * @param {amount} number - How many are being attempted to purchase
             * @return {number} - Calculated price 
             */
            calculateUpgradeCost: (basePrice, owns, amount) => {
                var price = 0;
                do {
                    price += basePrice * Math.pow(1.2, owns);
                    amount--;
                    owns++;
                } while (amount > 0);
                return Math.round(price)
            },
        };

        game.clickFunctions = {
            buy_upgrade: (name) => {
                var data = game.data.upgrades[name];

                if (!data) {
                    console.warn("No data found for upgrade: " + name);
                    return;
                };

                var price = game.helper.math.calculateUpgradeCost(data.cost, data.amount, game.tempData.purchaseAmount);
                if (game.data.music < price) return;

                game.data.music -= price;
                data.amount += game.tempData.purchaseAmount;
                game.sync.income();
                game.sync.upgradeList();
            },

            changeBulk: (amount) => {
                var valid = [1, 10, 100];
                if (!valid.includes(amount)) return;

                document.querySelector(`#bulkButton${amount}`).className = "bulkButtonSelected";
                document.querySelector(`#bulkButton${game.tempData.purchaseAmount}`).className = "bulkButton";

                game.tempData.purchaseAmount = amount;
                sync.upgradeList(true);
            }
        };

        game.onClicked = function(Todo, Data) {
            if (!game.loaded) {
                console.warn("onClick rejected, waiting to load data...", "onClicked")
                return
            };

            if (game.clickFunctions[Todo]) {
                try {
                    game.clickFunctions[Todo](Data);
                } catch (error) {
                    console.error("Function errored with name: " + Todo + "\nError: " + error);
                };
            } else {
                console.error("Called invalid function: " + Todo + "\nData: " + Data);
            };
        };

        game.loop = function () {
            game.sync.all();

            setInterval(() => {
                if (!game.loaded) return false;

                game.data.music += game.data.income / game.tick;
                game.data.totalMusic += game.data.income / game.tick;
                game.sync.pointHeader();

                for (i in game.data.achievements) {
                    var achievement = game.data.achievements[i];
                    var b = new Function("return " + achievement.req);
                    if (b() && !achievement.gotten) {
                        game.data.achievements[i].gotten = true;
                        document.querySelector("#achievements").innerHTML += `<br>

                                <div class="title"; style="height: 70%;" id="points_current">

                                </div>
                                <div class="small title" style="height: 30%;" id="points_per_second">
                                    ${achievement.desc}
                                </div>
                            </div>`
                    };

                    value.delay++;
                    if (value.delay > value.interval) {
                        value.delay = 0;
                        value.perform();
                    };
                };

            }, 1000/game.tick)
        };

        game.startup = function() {
            var cookies = game.storage.get();

            if (cookies != null && cookies != "undefined") {
                cookies = JSON.parse(cookies);

                for (i in game.data.upgrades) {
                    if (cookies.upgrades[i] == null) {
                        cookies.upgrades[i] = game.data.upgrades[i];
                    };
                };

                for (i in game.data.achievements) {
                    if (cookies.achievements[i] == null || game.data.achievements[i].text != game.data.achievements[i].text) {
                        cookies.achievements[i] = game.data.achievements[i];
                    };
                };

                game.data = cookies;
            };

            game.loop();
            game.loaded = true;
        };
